name: check repo

# Reusable workflow: the floor every repo's PR check stands on, for repos with no build of their
# own (config, compose stacks, charts, docs): every YAML and JSON file parses, every shell script
# passes `bash -n`, and no secret is in the tree or the history (gitleaks). A repo with a build
# adds its own job beside it. The check is `<caller job> / check`; main's ruleset requires it.
#
#   on: { pull_request: { branches: [main] } }   # no paths filter: a required check must start
#   jobs:
#     repo:
#       uses: 021is/ci/.github/workflows/check-repo.yml@main
#       with: { runs_on: '["self-hosted", "021"]' }   # private repos; public: '["ubuntu-latest"]'

on:
  workflow_call:
    inputs:
      runs_on:
        description: The runner labels as a JSON array (021's own runners take private repos only).
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 5
    steps:
      # The whole history: gitleaks reads every commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet PyYAML==6.0.3

      # Tracked files only. A template (a chart's templates/, a `*.tpl.*`) is not YAML until
      # rendered, so it is left to the repo's own render.
      - name: Every YAML and JSON file parses, every shell script passes bash -n
        run: |
          python - <<'PY'
          import json, re, subprocess, sys, yaml
          files = subprocess.run(["git", "ls-files"], check=True, capture_output=True, text=True).stdout.split()
          bad = 0
          for f in files:
              try:
                  if re.search(r"(^|/)templates/|\.tpl\.", f):
                      continue
                  if f.endswith((".yml", ".yaml")):
                      list(yaml.safe_load_all(open(f)))
                  elif f.endswith(".json"):
                      json.load(open(f))
                  elif f.endswith(".sh"):
                      run = subprocess.run(["bash", "-n", f], capture_output=True, text=True)
                      if run.returncode:
                          raise ValueError(run.stderr.strip())
                  else:
                      continue
                  print(f"ok: {f}")
              except Exception as e:
                  bad += 1
                  print(f"FAIL: {f}: {e}")
          sys.exit(1 if bad else 0)
          PY

      - name: Fetch gitleaks
        id: gitleaks
        if: ${{ !cancelled() }}
        env:
          VERSION: 8.30.1
          SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        # The same checksum-verified binary as check-go.yml.
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) arch=x64 sha256=$SHA256_X64 ;;
            ARM64) arch=arm64 sha256=$SHA256_ARM64 ;;
            *) echo "::error::No gitleaks pin for ${RUNNER_ARCH}."; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_${arch}.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$archive" -O gitleaks > "$RUNNER_TEMP/bin/gitleaks"
          chmod +x "$RUNNER_TEMP/bin/gitleaks"

      # No allowlist: an inline `gitleaks:allow` is ignored too.
      - name: gitleaks over the tree and the history
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/gitleaks" dir --redact --no-banner --ignore-gitleaks-allow .
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --ignore-gitleaks-allow .
